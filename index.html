<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Spotz App</title>
<script>try { document.documentElement.setAttribute("data-theme", localStorage.getItem("spotz:theme:v2") === "dark" ? "dark" : "light"); } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap">
<style>
/* Concepto: app móvil en una columna de hasta 480px. Barra superior, contenido con scroll, barra de 4 pestañas.
   El acceso es oscuro; el resto es claro con morado, como en los mockups de Spotz. */
:root {
  --bg: #FAFAFF;
  --ico: #1D1D1B;
  --ico-on: #6C5CE0;
  --outer: #FAFAFF;
  --surface: #FFFFFF;
  --fg: #262324;
  --muted: #6B6568;
  --line: #E6E3F5;
  --line2: #C9C4E6;
  --accent: #6C5CE0;
  --accent-ink: #FFFFFF;
  --soft: #ECE8FD;
  --soft-ink: #5236C9;
  --danger: #C93B54;
  --star: #F2A81D;
  --star-off: #D7D3EC;
  --on-photo: #FFFFFF;
  --scrim: rgba(18, 15, 43, .5);
  --shadow: 0 1px 3px rgba(28, 25, 71, .14), 0 2px 8px rgba(28, 25, 71, .08);
  --shadow-lg: 0 8px 28px rgba(28, 25, 71, .22);
  --m-land: #EEEBFA;
  --m-sea: #CFE0F6;
  --m-coast: #A9BFE4;
  --m-dot: #D9D4F0;
  --m-lbl: #625F8A;
  --m-lbl2: #6F86B8;
  --mark-dot: var(--bg);
  --a-bg: #222127;
  --a-field: #2B2760;
  --a-fg: #F4F2FF;
  --a-muted: #ABA7CC;
  --a-line: #433F78;
  --a-btn: #6C5CE0;
  --a-link: #BBAAFF;
  --a-err: #FF93A6;
  --a-off: #5B5780;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-display: 'Outfit', 'Figtree', system-ui, sans-serif;
}
@media all {
  :root[data-theme="dark"] {
    --bg: #120F2B;
    --ico: #EEEBFF;
    --ico-on: #8D78F5;
    --outer: #0A0820;
    --surface: #1B1840;
    --fg: #EEEBFF;
    --muted: #A5A1CD;
    --line: #2C2858;
    --line2: #433F78;
    --accent: #8D78F5;
    --accent-ink: #100C28;
    --soft: #2A2560;
    --soft-ink: #CBBFFF;
    --danger: #FF8197;
    --star-off: #3B3770;
    --scrim: rgba(4, 3, 16, .66);
    --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
    --shadow-lg: 0 8px 28px rgba(0, 0, 0, .55);
    --m-land: #1D1A45;
    --m-sea: #15264A;
    --m-coast: #30508F;
    --m-dot: #28245C;
    --m-lbl: #A5A1CD;
    --m-lbl2: #7C93CC;
    --mp-bg: #1A1E3B; --mp-rg: #1F2A47; --mp-lu: #21264A; --mp-lus: #2B3260; --mp-pk: #1D3A45; --mp-pks: #2A5C61; --mp-wt: #13325C; --mp-wts: #21508A; --mp-rv: #1B4577;
    --mp-s1: #6573B0; --mp-s2: #5C69A6; --mp-s3: #535F9C; --mp-s4: #475290; --mp-s5: #3B4584; --mp-s6: #2F3869; --mp-s7: #2B3362;
    --mp-rl0: #4A5280; --mp-rl1: #8F98C8; --mp-rl2: #6E78AE;
    --mp-halo: rgba(26, 30, 59, .94); --ml-city: #ECEEFF; --ml-water: #8DBDEE; --ml-reg: #7F88B8; --ml-zone: #C3C8F0; --ml-place: #D5D9F7; --ml-poi: #CBBFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120F2B;
    --ico: #EEEBFF;
    --ico-on: #8D78F5;
  --outer: #0A0820;
  --surface: #1B1840;
  --fg: #EEEBFF;
  --muted: #A5A1CD;
  --line: #2C2858;
  --line2: #433F78;
  --accent: #8D78F5;
  --accent-ink: #100C28;
  --soft: #2A2560;
  --soft-ink: #CBBFFF;
  --danger: #FF8197;
  --star-off: #3B3770;
  --scrim: rgba(4, 3, 16, .66);
  --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  --shadow-lg: 0 8px 28px rgba(0, 0, 0, .55);
  --m-land: #1D1A45;
  --m-sea: #15264A;
  --m-coast: #30508F;
  --m-dot: #28245C;
  --m-lbl: #A5A1CD;
  --m-lbl2: #7C93CC;
  --mp-bg: #1A1E3B; --mp-rg: #1F2A47; --mp-lu: #21264A; --mp-lus: #2B3260; --mp-pk: #1D3A45; --mp-pks: #2A5C61; --mp-wt: #13325C; --mp-wts: #21508A; --mp-rv: #1B4577;
  --mp-s1: #6573B0; --mp-s2: #5C69A6; --mp-s3: #535F9C; --mp-s4: #475290; --mp-s5: #3B4584; --mp-s6: #2F3869; --mp-s7: #2B3362;
  --mp-rl0: #4A5280; --mp-rl1: #8F98C8; --mp-rl2: #6E78AE;
  --mp-halo: rgba(26, 30, 59, .94); --ml-city: #ECEEFF; --ml-water: #8DBDEE; --ml-reg: #7F88B8; --ml-zone: #C3C8F0; --ml-place: #D5D9F7; --ml-poi: #CBBFFF;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--outer);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
@media (max-width: 520px) { body { background: var(--bg); } }
h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.g { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.plain { background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.ic { display: block; flex: none; }

/* ---------- Estructura ---------- */
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); overflow: hidden; }
@media (min-width: 521px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
#shell { position: relative; display: flex; flex-direction: column; height: 100%; }
#top { flex: none; background: var(--bg); border-bottom: 1px solid var(--line); }
#tabs { flex: none; background: var(--bg); border-top: 1px solid var(--line); }
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; position: relative; }
.view.flush { overflow: hidden; }
.page { padding-block: 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.feed { padding-block: 0 24px; }
.sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-family: var(--f-body); }

/* ---------- Marca ---------- */
.mark { display: block; flex: none; overflow: visible; }
.mark .lg-i { fill: var(--logo-ink, var(--fg)); }
.mark .lg-p { fill: #6C5CE0; }
#auth { --logo-ink: #FAFAFF; }
.mk-btn { display: flex; align-items: center; background: none; border: 0; padding: 4px 8px 4px 0; flex: none; color: var(--fg); }

/* ---------- Barra superior y pestañas ---------- */
.top-in { display: flex; align-items: center; gap: 6px; min-height: 60px; }
.pill { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--muted); text-align: left; }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ib { position: relative; display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: none; border: 0; color: var(--fg); }
.ib.sm { width: 36px; height: 36px; }
.ib.solid { background: var(--surface); box-shadow: var(--shadow); }
.ib.sv.on { color: var(--accent); }
.badge { position: absolute; top: 1px; right: 0; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.badge.in { position: static; margin-left: auto; border: 0; }
.ph-t { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; text-align: center; }
.btn.soft { background: var(--soft); color: var(--soft-ink); }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line2); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger-o { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
.btn.block { display: flex; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1 1 auto; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lab, .lab { font-weight: 700; font-size: 14px; }
.field small { font-size: 12px; }
.field input, .field textarea, .field select { width: 100%; min-height: 46px; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--fg); }
.field textarea { resize: vertical; min-height: 84px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 340px) { .two { grid-template-columns: 1fr; } }
.err { color: var(--danger); font-size: 13px; font-weight: 700; }
.err:empty { display: none; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 8px 0; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.static { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; font-size: 12px; background: var(--soft); color: var(--soft-ink); border-color: transparent; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--soft); }
.seg button { flex: 1; min-height: 36px; border: 0; border-radius: 999px; background: none; font-weight: 700; color: var(--soft-ink); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.utabs { display: flex; border-bottom: 1px solid var(--line); }
.utabs button { flex: 1; min-height: 46px; background: none; border: 0; border-bottom: 2.5px solid transparent; font-weight: 700; color: var(--muted); }
.utabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* ---------- Avatares y calificación ---------- */
.av { display: inline-grid; place-items: center; flex: none; border-radius: 50%; object-fit: cover; color: #fff; font-weight: 700; font-family: var(--f-display); }
.stars { display: inline-flex; gap: 1px; }
.st { color: var(--star-off); display: inline-flex; }
.st.on { color: var(--star); }
.rate { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; }
.rate-n { font-size: 13px; color: var(--muted); }
.stpick { display: flex; justify-content: center; gap: 6px; }
.stp { background: none; border: 0; padding: 4px; color: var(--star-off); }
.stp.on { color: var(--star); }

/* ---------- Publicaciones ---------- */
.post { padding-block: 14px 8px; border-bottom: 1px solid var(--line); }
.post-h { display: flex; align-items: center; gap: 10px; }
.who { flex: 1; min-width: 0; display: block; }
.ph-user { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; border-radius: 12px; }
.uname { display: block; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.pmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 13px; color: var(--muted); }
.pmeta .ic { color: var(--fg); }
.tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--soft); color: var(--soft-ink); padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
.photo { position: relative; margin-top: 10px; border-radius: 14px; overflow: hidden; background: var(--soft); }
.car { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car img { flex: 0 0 100%; width: 100%; aspect-ratio: 1.22 / 1; object-fit: cover; scroll-snap-align: center; display: block; }
.hero .car img { aspect-ratio: 4 / 3; }
.dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--on-photo); opacity: .5; }
.dots i.on { opacity: 1; }
.ph-none { aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
.spot-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.sp-ic { flex: none; color: var(--accent); display: grid; }
.sp-t { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
.sp-t b { font-size: 15px; }
.cap { margin-top: 8px; font-size: 14px; overflow-wrap: anywhere; }
.acts { display: flex; gap: 2px; margin: 4px 0 0 -10px; }
.act { display: inline-flex; align-items: center; gap: 5px; min-height: 42px; padding: 0 10px; background: none; border: 0; border-radius: 21px; color: var(--fg); font-weight: 700; font-size: 14px; }
.act.on { color: var(--accent); }

/* ---------- Buscar, spot, listas ---------- */
.sbar { display: flex; align-items: center; gap: 6px; padding-block: 8px; }
.sfield { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.sfield:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.sfield input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); outline: none; height: 100%; }
.reslist { display: flex; flex-direction: column; gap: 14px; }
.res { display: flex; align-items: center; gap: 4px; }
.res-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.res-b { min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.res-b b { font-size: 15px; color: var(--fg); }
.thumb { position: relative; flex: none; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
.thumb.lg { width: 76px; height: 76px; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.empty-s { text-align: center; padding: 20px 8px; color: var(--muted); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 56px 12px; }
.empty .eic { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
.empty h2 { font-size: 18px; }
.empty p { color: var(--muted); max-width: 32ch; }
.sp-head h1 { font-size: 26px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.facts small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts b { font-size: 14px; }
.note { font-size: 12px; color: var(--muted); background: var(--soft); padding: 8px 12px; border-radius: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.gt { position: relative; aspect-ratio: 1; padding: 0; border: 0; overflow: hidden; border-radius: 6px; background: var(--soft); }
.gt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.multi { position: absolute; top: 6px; right: 6px; color: var(--on-photo); display: grid; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6)); }
.rev { padding: 10px 0; border-bottom: 1px solid var(--line); }
.rev p { margin-top: 6px; overflow-wrap: anywhere; }
.rv-h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.rv-h .muted { font-size: 13px; }

/* ---------- Notificaciones ---------- */
.nlist { display: flex; flex-direction: column; gap: 4px; }
.nrow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; }
.nrow.unread { background: var(--soft); }
.nic { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
.unread .nic { background: var(--surface); }
.nb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }

/* ---------- Cuenta y edición ---------- */
.acc-h { display: flex; align-items: center; gap: 16px; }
.av-open { flex: none; line-height: 0; border-radius: 50%; cursor: zoom-in; }
.av-open .av { transition: transform .15s ease; }
.av-open:active .av { transform: scale(.96); }
.sheet-bg.avv { align-items: center; justify-content: center; padding: 16px; }
.avv .sheet { width: min(100%, 440px); max-height: 100%; border-radius: 24px; animation: avZoom .22s cubic-bezier(.22, .8, .24, 1); }
.avv .grab { display: none; }
.avv .sheet-in { align-items: stretch; gap: 10px; padding-block: 10px 18px; }
.avv-x { align-self: flex-end; }
.avv-img { display: block; width: 100%; aspect-ratio: 1; max-height: 66vh; object-fit: contain; border-radius: 18px; background: var(--soft); }
.avv-n { display: grid; gap: 2px; text-align: center; font-size: 15px; }
@keyframes avZoom { from { transform: scale(.92); opacity: 0; } }
.acc-id { min-width: 0; }
.acc-id h1 { font-size: 21px; overflow: hidden; text-overflow: ellipsis; }
.acc-id p { font-size: 14px; }
.bio { overflow-wrap: anywhere; }
.ep-av { display: flex; align-items: center; gap: 16px; }
.ep-b { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.ep-b:has(#ep-file:focus-visible) label { outline: 3px solid var(--accent); outline-offset: 2px; }
.ep-b label { cursor: pointer; }
.up { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.up-t, .up-add { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; }
.up-t img { width: 100%; height: 100%; object-fit: cover; display: block; }
.up-x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .65); color: #fff; }
.up-add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px dashed var(--line2); color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; }
.field:has(#a-file:focus-visible) .up-add { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Mapa ---------- */
.mapwrap { position: absolute; inset: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--mp-bg, #e8f4f8); user-select: none; -webkit-user-select: none; }
.stage:active { cursor: grabbing; }
.world { position: absolute; inset: 0; overflow: hidden; }
.world svg { position: absolute; left: 0; top: 0; display: block; max-width: none; transform-origin: 0 0; will-change: transform; }
.lbls { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ====================== v5: iconos de la marca, cuenta oficial, publicar, panel ====================== */

/* ---------- Iconos propios (normal #1D1D1B, hover/activo #6C5CE0) ---------- */
.ico { display: block; flex: none; overflow: visible; color: var(--ico); transition: color .22s ease, transform .22s cubic-bezier(.3, 1.4, .5, 1); }
.ib.hi, .tab { color: var(--ico); }
.ib.hi:active .ico, .tab:active .ico { color: var(--ico-on); transform: scale(.86); }
.ib.hi.on .ico, .tab[aria-current] .ico, .tab:focus-visible .ico { color: var(--ico-on); }
@media (hover: hover) {
  .ib.hi:hover .ico, .tab:hover .ico { color: var(--ico-on); }
  .tab:hover .ico { transform: translateY(-2px); }
  .ib.hi:hover .ico-lupa { animation: lupaTilt .5s ease-in-out; }
  .ib.hi:hover .ico-noti { transform-origin: 50% 6%; animation: bellRing .7s ease-in-out; }
  .ib.hi:hover .ico-opciones .b1 { transform: translateX(-5px); }
  .ib.hi:hover .ico-opciones .b3 { transform: translateX(5px); }
}
.ico-opciones rect { transform-box: fill-box; transition: transform .26s cubic-bezier(.3, 1.4, .5, 1); }
.ib.hi:focus-visible .ico-opciones .b1 { transform: translateX(-5px); }
.ib.hi:focus-visible .ico-opciones .b3 { transform: translateX(5px); }
@keyframes lupaTilt { 0% { transform: rotate(0); } 30% { transform: rotate(-16deg) scale(1.1); } 65% { transform: rotate(8deg) scale(1.05); } 100% { transform: none; } }
@keyframes bellRing { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(16deg); } 35% { transform: rotate(-13deg); } 55% { transform: rotate(9deg); } 75% { transform: rotate(-4deg); } }
@keyframes icoPop { 0% { transform: scale(.7); } 55% { transform: scale(1.22); } 78% { transform: scale(.95); } 100% { transform: scale(1); } }
@keyframes icoHouse { 0% { transform: translateY(2px) scale(.85); } 38% { transform: translateY(-6px) scale(1.12); } 70% { transform: translateY(1px); } 100% { transform: none; } }
@keyframes icoPin { 0% { transform: translateY(-12px) scaleY(1.12); } 55% { transform: translateY(0) scaleY(.86); } 80% { transform: translateY(-2px) scaleY(1.05); } 100% { transform: none; } }
@keyframes icoMap { 0% { transform: rotate(-16deg) scale(.82); } 60% { transform: rotate(7deg) scale(1.14); } 100% { transform: none; } }
@keyframes icoUser { 0% { transform: translateY(8px) scale(.82); } 55% { transform: translateY(-5px) scale(1.12); } 100% { transform: none; } }
.ico.pop { animation: icoPop .46s cubic-bezier(.3, 1.4, .5, 1); }
.ico-inicio.pop { animation: icoHouse .5s cubic-bezier(.3, 1.3, .5, 1); }

.cp-loc { display: flex; flex-direction: column; border: 1.5px solid var(--line2); border-radius: 14px; background: var(--surface); overflow: hidden; }

:root[data-theme="dark"] .st-chip.no { background: #4A1D2A; color: #FFA9BA; }
.rowbtns { display: flex; gap: 4px; flex: none; }

:root[data-theme="dark"] .pin-state.ok { background: #16402E; color: #86E3B5; }
.admin-box { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; border: 1.5px dashed var(--accent); }

/* ---------- Mapa: búsqueda, resultados y edición de pines ---------- */

.sug { display: flex; align-items: center; gap: 12px; width: 100%; padding: 4px 0; min-height: 52px; }

/* ---------- Barra inferior: botón central de publicar (publi.svg; se pinta morado al tocar o pasar el cursor) ---------- */
.tab-plus { display: grid; place-items: center; min-height: 51px; padding: 0; background: none; border: 0; color: var(--fg); transition: color .2s ease; }
.tab-plus .ico { color: inherit; transition: transform .3s cubic-bezier(.3, 1.4, .5, 1); }
.tab-plus:active { color: var(--ico-on); }
.tab-plus:active .ico { transform: scale(.9); }
.tab-plus:focus-visible { color: var(--ico-on); outline: 3px solid var(--accent); outline-offset: -4px; border-radius: 18px; }
@media (hover: hover) { .tab-plus:hover { color: var(--ico-on); } .tab-plus:hover .ico { transform: scale(1.07); } }

/* ---------- Deslizar hacia abajo para actualizar ---------- */
.ptr { display: flex; align-items: center; justify-content: center; height: var(--pull, 0px); overflow: hidden; margin-inline: -16px; }
.ptr-i { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); color: var(--accent); box-shadow: var(--shadow); opacity: var(--pr, 0); transform: rotate(calc(var(--pr, 0) * 300deg)) scale(calc(.55 + var(--pr, 0) * .45)); }
.ptr.ready .ptr-i { background: var(--accent); color: var(--accent-ink); }
.ptr.spin .ptr-i { opacity: 1; animation: ptrSpin .7s linear infinite; }
@keyframes ptrSpin { to { transform: rotate(360deg); } }
.view.pulling { -webkit-user-select: none; user-select: none; cursor: grabbing; }

.ptr.flat { margin-inline: 0; }
.nrow.clearing { background: transparent; }
.nrow .udot { transition: opacity .35s ease, transform .35s ease; }
.nrow.clearing .udot { opacity: 0; transform: scale(.2); }

/* ---------- Selector de fotos: el input real va encima del botón (más fiable en el celular) ---------- */
.fp { position: relative; overflow: hidden; }
.fpick { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; font-size: 16px; }
.fpick::-webkit-file-upload-button { cursor: pointer; }
.cp-load { text-align: center; font-size: 13px; font-weight: 600; }
.cp-load:not([hidden]) { animation: fadeIn .2s ease-out; }

/* ---------- Barra superior sin línea de separación ---------- */
#top { border-bottom: 0; }

/* ---------- Barra superior flotante (se oculta al deslizar) y tamaños ---------- */
#shell.tf #top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; transition: transform .32s cubic-bezier(.3, .7, .2, 1); will-change: transform; }
#shell.tf #top.away { transform: translateY(-101%); }
#shell.tf .view { padding-top: var(--top-h, 56px); }
.top-main .mark { height: 33.6px; width: auto; }
@media (prefers-reduced-motion: reduce) { #shell.tf #top { transition: none; } }

/* ---------- Comentarios ---------- */
.sheet.cs { height: 86%; max-height: 86%; overflow: hidden; display: flex; flex-direction: column; }
.sheet.cs .sheet-in { flex: 1; min-height: 0; padding-block: 2px 0; gap: 0; }
.cs-h { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 0 8px; }
.cs-h .sh-t { font-size: 17px; }
.cs-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-inline: -16px; padding: 6px 16px 14px; display: flex; flex-direction: column; gap: 18px; outline: 0; }
.cm-th { display: flex; flex-direction: column; gap: 12px; }
.cm { display: flex; align-items: flex-start; gap: 10px; border-radius: 12px; }
.cm.flash { animation: cmFlash 1.8s ease-out; }
@keyframes cmFlash { 0%, 50% { background: color-mix(in srgb, var(--accent) 16%, transparent); } 100% { background: transparent; } }
.cm-av { flex: none; line-height: 0; }
.cm-b { flex: 1; min-width: 0; }
.cm-l { display: flex; align-items: center; gap: 4px; min-width: 0; }
.cm-n { font-weight: 700; font-size: 13.5px; color: var(--fg); }
.cm-t { margin-left: 4px; font-size: 12px; color: var(--muted); }
.cm-x { margin: 2px 0 0; font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.cm-m { color: var(--accent); font-weight: 600; }
.cm-a { display: flex; gap: 16px; margin-top: 2px; }
.cm-a button { min-height: 30px; padding: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.cm-a button.arm { color: var(--danger); }
.cm-lk { flex: none; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; min-width: 38px; min-height: 42px; padding: 4px 2px; background: none; border: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
.cm-lk.on { color: var(--accent); }
.cm-lk.pop svg { animation: heartPop .4s ease-out; }
.cm-more { display: flex; align-items: center; gap: 10px; min-height: 30px; margin-left: 46px; padding: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.cm-more i { width: 24px; height: 1px; background: var(--line2); }
.cm-rps { display: flex; flex-direction: column; gap: 14px; margin-left: 46px; }
.cm-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 48px 12px; text-align: center; color: var(--muted); }
.cm-empty b { color: var(--fg); font-size: 16px; }
.cs-reply { flex: none; display: flex; align-items: center; justify-content: space-between; margin-inline: -16px; padding: 2px 10px 2px 16px; background: var(--bg); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.cs-reply b { color: var(--fg); }
.cs-bar { flex: none; display: flex; align-items: center; gap: 10px; margin-inline: -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.cs-reply + .cs-bar { border-top: 0; }
.cs-bar input { flex: 1; min-width: 0; height: 42px; padding: 0 16px; border-radius: 21px; border: 1.5px solid var(--line2); background: var(--bg); color: var(--fg); font-size: 16px; }
.cs-bar input:focus { outline: 0; border-color: var(--accent); }
.cs-send { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; transition: opacity .15s ease, transform .15s ease; }
.cs-send:disabled { opacity: .35; }
.cs-send:not(:disabled):active { transform: scale(.92); }

/* ---------- Ícono junto a "Ver spot" y nuevo pin del mapa (forma del ícono de spot) ---------- */
.post .act.vs { gap: 6px; }
.post .act.vs .ico { width: auto; height: 19px; color: inherit; }
.pin { height: 46px; margin-top: -46px; transform-origin: 17px 46px; }
.pin svg { overflow: visible; }

/* ---------- Etiquetas (@) ---------- */
.mn { display: inline; padding: 0; font: inherit; font-weight: 600; color: var(--accent); cursor: pointer; }
.mn-host { position: relative; }
.mn-pop { position: absolute; left: 0; right: 0; z-index: 8; display: flex; flex-direction: column; max-height: 304px; overflow-y: auto; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.mn-pop.up { bottom: calc(100% + 6px); }
.mn-pop.dn { top: calc(100% + 6px); }
.cs-bar .mn-pop { left: 10px; right: 10px; }
.mn-it { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; background: none; border: 0; border-radius: 12px; color: var(--fg); text-align: left; }
.mn-it.on { background: var(--soft); }
@media (hover: hover) { .mn-it:hover { background: var(--soft); } }
.mn-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.mn-u { display: flex; align-items: center; gap: 4px; font-size: 14px; }
.mn-t small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-none { margin: 0; padding: 12px; font-size: 13px; color: var(--muted); }
.mn-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mn-btn { min-height: 34px; padding: 0 2px; font-size: 13px; font-weight: 700; color: var(--accent); }
.cs-at { flex: none; width: 36px; height: 40px; padding: 0; background: none; border: 0; color: var(--muted); font-size: 19px; font-weight: 800; }
@media (hover: hover) { .cs-at:hover { color: var(--accent); } }

/* ---------- Acciones de la publicación: compactas para que "Ver spot" nunca baje de línea ---------- */
.post .acts { container-type: inline-size; flex-wrap: nowrap; gap: 0; margin: 8px 0 0 -5px; }
.post .act { flex: none; gap: 3px; padding: 0 5px; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.post .act .ic { width: 23px; height: 23px; }
.post .act.vs { margin-left: auto; margin-right: -5px; gap: 5px; padding: 0 5px 0 8px; }
.post .act.vs .ico { height: 17px; }
@container (max-width: 316px) {
  .post .act { padding: 0 4px; font-size: 13px; }
  .post .act .ic { width: 21px; height: 21px; }
  .post .act.vs { padding: 0 4px 0 6px; gap: 4px; }
  .post .act.vs .ico { height: 15px; }
}

/* ---------- Doble toque en la foto y en los comentarios ---------- */
.post .photo, .cm { touch-action: manipulation; }
.post .photo { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.dt-heart { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; color: #fff; pointer-events: none; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .38)); animation: dtHeart .85s cubic-bezier(.2, .8, .3, 1) forwards; }
@keyframes dtHeart { 0% { transform: scale(.4); opacity: 0; } 22% { transform: scale(1.18); opacity: 1; } 40% { transform: scale(.94); } 62% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.22) translateY(-10px); opacity: 0; } }

/* ---------- Comentarios: orden y deslizar para cerrar ---------- */
.cs-sort { flex: none; position: relative; display: flex; padding: 0 0 6px; }
.cs-sortb { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 6px 0 0; background: none; border: 0; border-radius: 10px; color: var(--fg); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.cs-sortb .chev { display: grid; place-items: center; color: var(--muted); transform: rotate(-90deg); transition: transform .2s ease; }
.cs-sortb[aria-expanded="true"] .chev { transform: rotate(90deg); }
.cs-menu { position: absolute; top: calc(100% - 2px); left: 0; z-index: 9; min-width: 210px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); animation: cardUp .18s cubic-bezier(.22, .8, .24, 1) backwards; }
.cs-mi { display: flex; align-items: center; width: 100%; min-height: 44px; padding: 0 12px; background: none; border: 0; border-radius: 12px; color: var(--fg); font: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
@media (hover: hover) { .cs-mi:hover { background: var(--soft); } }
.sheet-bg { background: color-mix(in srgb, var(--scrim) calc(var(--sa, 1) * 100%), transparent); }
.sheet.cs { will-change: transform; }
.cs-h, .grab { touch-action: none; }

/* ---------- Ventana del botón +: Publicar / Publicar Spot ---------- */
.pub-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.pub-o { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; text-align: left; border: 1.5px solid var(--line2); border-radius: 18px; background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
.pub-o:active { transform: scale(.98); }
@media (hover: hover) { .pub-o:hover { border-color: var(--accent); background: var(--soft); } }
.pub-i { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--soft); color: var(--accent); }
.pub-i .ico { color: inherit; }
.pub-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pub-t b { font-size: 16px; }
.pub-t small { font-size: 13px; line-height: 1.35; color: var(--muted); }
.pr-d { display: flex; flex-direction: column; gap: 6px; }
.pr-d h3 { margin: 0; font-size: 17px; }
.pr-d p { margin: 0; }

[hidden] { display: none !important; }
.quote { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
.menu-h .un { display: flex; }

/* ====================== v6: Spots y Dots con los colores de sus SVG ======================
   Spot: morado #6c5ce0 (macizo) · Dot: #fafaff con borde morado. Los pines del mapa llevan siempre estos colores. */
:root { --pin-spot: #6C5CE0; --pin-dot: #FAFAFF; --pin-edge: #6C5CE0; --spot-red: #6C5CE0; --spot-ink: #5545C4; }
:root[data-theme="dark"] { --spot-red: #8D78F5; --spot-ink: #C9BEFF; }

/* Pines del mapa: Dot morado y Spot rojo, un poco más grande (formas nuevas) */
.pin { width: 33.3px; height: 46px; margin: -46px 0 0 -16.65px; transform-origin: 16.65px 46px; }
.pin.is-spot { width: 37px; height: 60px; margin: -60px 0 0 -18.5px; transform-origin: 18.5px 60px; }
.pin g { fill: currentColor; stroke: #fff; }
.pin.is-spot g { fill: var(--pin-spot); stroke: #fff; }
.pin:not(.is-spot):not(.pl) g { fill: var(--pin-dot); stroke: var(--pin-edge); }
.pin.is-spot.mk { z-index: 4; }
.sug-i.is-spot { color: var(--spot-red); background: color-mix(in srgb, var(--spot-red) 14%, var(--surface)); }

/* Etiqueta "Spot" / "Dot" */
.kind-tag { display: inline-flex; align-items: center; vertical-align: middle; margin-left: 8px; min-height: 20px; padding: 0 8px; border-radius: 999px; font-family: var(--f-body); font-size: 10.5px; font-weight: 800; letter-spacing: .06em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
.kind-tag.is-spot { background: var(--pin-spot); color: #fff; }
.kind-tag.is-dot { background: var(--pin-dot); color: #5545C4; box-shadow: inset 0 0 0 1.5px var(--pin-edge); }
.sp-head h1 .kind-tag { font-size: 11px; min-height: 22px; transform: translateY(-3px); }

/* Mapa: botones para ocultar Spots y Dots */
.mflt { display: flex; gap: 8px; padding-block: 2px 6px; pointer-events: auto; }
.mf { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 13px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--fg); font-size: 13px; font-weight: 700; box-shadow: var(--shadow); transition: background-color .15s ease, color .15s ease, transform .15s ease; }
.mf:active { transform: scale(.96); }
.mf-sw { flex: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.mf-spot .mf-sw { background: var(--pin-spot); }
.mf-dot .mf-sw { background: var(--pin-dot); box-shadow: inset 0 0 0 2.5px var(--pin-edge), 0 0 0 2px var(--surface); }
.mf.off { background: var(--soft); color: var(--muted); }
.mf.off .mf-sw { background: transparent; box-shadow: inset 0 0 0 2px var(--muted); }

/* Página de un Spot: sus Dots con las fotos de la gente */
.dot-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.dot-c { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.dot-h { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; text-align: left; color: var(--fg); }
.dot-h .thumb { width: 56px; height: 56px; }
.dot-h .res-b { flex: 1; }
.dh-go { flex: none; display: grid; color: var(--muted); transform: rotate(180deg); }
.ds-strip { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 12px; scrollbar-width: none; }
.ds-strip::-webkit-scrollbar { display: none; }
.ds-p { flex: none; width: 84px; height: 84px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--soft); }
.ds-p img { display: block; width: 100%; height: 100%; object-fit: cover; }
.spot-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 36px; padding: 0 14px 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--spot-red) 12%, var(--surface)); color: var(--spot-ink); font-size: 13px; }
.spot-link .ico { color: inherit; }

/* Elegir el tipo y elegir el Spot de un Dot */
.pub-o.is-spot .pub-i { background: color-mix(in srgb, var(--spot-red) 14%, var(--surface)); color: var(--spot-red); }
@media (hover: hover) { .pub-o.is-spot:hover { border-color: var(--spot-red); background: color-mix(in srgb, var(--spot-red) 8%, var(--surface)); } }
.pub-i .ico { color: inherit; }
.cp-lrow .chev.go { transform: rotate(180deg); }
.cp-lrow .ico { color: inherit; }
/* ---------- Mejoras tras la prueba de usabilidad ---------- */
.lg-new { display: grid; gap: 2px; margin-top: clamp(28px, 9vh, 80px); text-align: center; color: var(--a-muted); font-size: 14px; }
.lg-btn.alt { width: 100%; background: none; color: var(--a-link); border: 0; }
.lg-btn.sm { align-self: center; min-height: 50px; min-width: max(168px, 47%); padding: 0 32px; font-size: 15px; }
/* Acceso según el boceto: logo grande arriba, formulario angosto abajo y “Crear cuenta nueva” al pie */
.lg-login { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.lg-login .lg-logo { flex: 1; min-height: 150px; align-items: center; padding: 0; }
.lg-login .lg-logo svg { width: clamp(170px, 56.7%, 340px); height: auto; }
.lg-login .lg-form { gap: 12px; width: clamp(312px, 78.5%, 440px); max-width: 100%; align-self: center; }
.lg-login .lg-in { min-height: 44px; }
.lg-login .lg-link { font-size: 12px; }
.lg-login .lg-new { gap: 0; margin-top: clamp(24px, 5vh, 56px); font-size: 13px; }
.lg-login .lg-new .lg-btn { min-height: 44px; font-size: 15px; }
.lg-help { display: block; margin-top: 2px; font-size: 12px; line-height: 1.35; color: var(--a-muted); }
.un-h { display: block; margin-top: 4px; font-size: 12px; line-height: 1.35; color: var(--muted); }
.lg .un-h { color: var(--a-muted); }
.un-h.ok { color: #166B43; font-weight: 700; }
.un-h.bad { color: var(--danger); font-weight: 700; }
.lg .un-h.ok { color: #7FE3AE; }
.ib.backb { width: auto; min-width: 40px; padding: 0 12px 0 6px; gap: 2px; border-radius: 20px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; }
.sd-card { display: flex; gap: 14px; align-items: flex-start; padding: 14px; border: 1.5px solid var(--line2); border-radius: 18px; background: var(--surface); }
.sd-card p { margin: 2px 0 4px; }
.sd-i { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: color-mix(in srgb, var(--pin-dot) 14%, var(--surface)); color: var(--pin-dot); }
.sd-card.is-spot .sd-i { background: color-mix(in srgb, var(--spot-red) 14%, var(--surface)); color: var(--spot-red); }
.sd-i .ico { color: inherit; }
.sd-n { font-size: 13px; }
.se-link.inl { display: inline; min-height: 0; padding: 0; font-size: inherit; }
.cp-loc > .se-link.inl { display: inline-block; align-self: flex-start; margin: -4px 14px 12px 14px; font-size: 13px; }
.sec-sub { margin: -4px 0 10px; font-size: 13px; }
.mf-help { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line2); background: var(--surface); color: var(--accent); font-weight: 800; font-size: 16px; box-shadow: var(--shadow); }
.m-add { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 46px; z-index: 4; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; box-shadow: var(--shadow-lg); }
.m-add[hidden] { display: none; }
.sp-prop { margin-top: 18px; }
.my-props { margin-top: 18px; }
.my-props .hrow { width: 100%; text-align: left; font: inherit; color: inherit; }
.st-chip.pend { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }
.pk-s { position: relative; flex: 1; min-width: 0; }
.pk-s .tfield { box-shadow: var(--shadow); background: var(--surface); height: 44px; }
.pk-res { position: absolute; left: 0; right: 0; top: 50px; max-height: 48vh; overflow-y: auto; padding: 4px 12px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-lg); }
.pk-res[hidden], .pk-help[hidden] { display: none; }
.pk-help { position: absolute; left: 0; right: 0; bottom: 84px; z-index: 5; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
.pk-help span { padding: 8px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; text-align: center; }
.pk-map .pin:not(.mk) { opacity: .5; filter: grayscale(.7); pointer-events: none; }
.cp-hint { margin-top: 10px; font-size: 13px; }
.cp-drop2 { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 16px; border: 2px dashed var(--line2); border-radius: 18px; background: var(--surface); text-align: center; }
.cp-drop2 b { font-size: 17px; font-family: var(--f-display); }
.cp-picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 8px; }
.cp-pick { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 96px; border: 2px solid var(--accent); border-radius: 16px; color: var(--accent); font-weight: 800; cursor: pointer; }
.cp-pick:focus-within, .cp-add:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.cp-n { top: 8px; bottom: auto; }
.cp-sw { position: relative; flex: none; max-width: 78%; scroll-snap-align: start; }
.cp-strip .cp-sw img { display: block; height: 168px; width: auto; max-width: 100%; aspect-ratio: var(--ar, 1); object-fit: cover; border-radius: 14px; background: var(--soft); }
.cp-sw .up-x { width: 32px; height: 32px; }

/* ---------- Botón +: píldora de publi_dark (modo claro) / publi_white (modo oscuro) / publi_hover (morado al pasar, tocar o enfocar); sube sobre la barra para destacar ---------- */

/* ---------- Campana: noti_dark (#262324) en modo claro, noti_white (#fafaff) en modo oscuro, noti_hover (#6c5ce0) al pasar/tocar ---------- */
.ib.hi .ico-noti { color: #262324; }
:root[data-theme="dark"] .ib.hi .ico-noti { color: #fafaff; }

/* ---------- Publicaciones del feed: sin marco, separadas por una línea fina de lado a lado ---------- */
:root { --feed-sep: #928BC0; }

.post { position: relative; margin-bottom: 0; padding: 14px 0 12px; border: 0; border-radius: 0; background: none; box-shadow: none; }

/* ---------- v26: robustez (textos largos, pantallas de 320 px, contraste en modo oscuro, ventanas modales) ---------- */
body { overflow-wrap: break-word; }

/* ---------- Feed estilo Threads: avatar a la izquierda con “+”, hora, fotos como tarjetas, barra inferior que se oculta ---------- */

  for (let i = 1; i <= 5; i++) o += `<button type="button" class="stp ${i <= val ? 'on' : ''}" data-act="${act}" data-n="${i}" aria-label="${i} ${i === 1 ? 'estrella' : 'estrellas'}" aria-pressed="${i <= val}">${ic('star', 32, true)}</button>`;

}

}

let SHEET_OPENER = null;
function sheet(html) {
  const host = $('#sheets');
  if (!host.firstChild) SHEET_OPENER = document.activeElement;
  host.innerHTML = '';
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab"></div><div class="g sheet-in">${html}</div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  host.appendChild(bg);
  const dlg = bg.firstElementChild, ttl = dlg.querySelector('.sh-t, h2');
  if (ttl) { if (!ttl.id) ttl.id = 'sh-ttl'; dlg.setAttribute('aria-labelledby', ttl.id); }

}

  const host = $('#sheets'), had = !!host.firstChild;
  host.innerHTML = '';
  [$('#shell'), $('#auth')].forEach(n => { if (n) n.inert = false; });
  const o = SHEET_OPENER;
  SHEET_OPENER = null;
  if (had && o && o.isConnected && /^(BUTTON|A)$/.test(o.tagName)) { try { o.focus({ preventScroll: true }); } catch (e) { /* sin foco */ } }

/* ============ Fotos: reducir antes de guardar ============ */
/* Lee una foto de la galería, la reduce y la devuelve como data:image/jpeg.
   Primero por FileReader + <img> (respeta la orientación de la cámara y no usa blob:); si falla, createImageBitmap. */
function fileToData(file, max, q, square) {
  const draw = (src, iw, ih) => {
    let sx = 0, sy = 0, sw = iw, sh = ih;
    if (square) { const m = Math.min(iw, ih); sx = (iw - m) / 2; sy = (ih - m) / 2; sw = sh = m; }
    const k = Math.min(1, max / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
    const out = c.toDataURL('image/jpeg', q);
    ARC.set(out, w / h);
    return out;
  };
  const viaImg = () => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('No se pudo leer el archivo'));
    fr.onload = () => {
      const im = new Image();
      im.onload = () => { try { res(draw(im, im.naturalWidth, im.naturalHeight)); } catch (e) { rej(e); } };
      im.onerror = () => rej(new Error('Formato de imagen no compatible'));
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
  const viaBitmap = () => createImageBitmap(file).then(bm => { const r = draw(bm, bm.width, bm.height); if (bm.close) bm.close(); return r; });
  return viaImg().catch(err => (typeof createImageBitmap === 'function' ? viaBitmap() : Promise.reject(err)));
}

function buildFeed() {
  const m = me(), now = Date.now();
  let list = S.posts.filter(p => user(p.uid) && (!p.spotId || S.spots[p.spotId]));
  if (feedMode === 'following') list = list.filter(p => m.following.includes(p.uid) || p.uid === m.id).sort((a, b) => b.ts - a.ts);
  else if (feedMode === 'recent') list.sort((a, b) => b.ts - a.ts);
  else {
    const score = p => Math.random() * .7 + Math.max(0, 1 - (now - p.ts) / (10 * DAY)) * .3 + (m.following.includes(p.uid) ? .2 : 0) + (p.uid === m.id && now - p.ts < DAY ? 2 : 0);
    list = list.map(p => [score(p), p]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  }
  list = list.filter(p => p.uid === m.id).sort((a, b) => b.ts - a.ts).concat(list.filter(p => p.uid !== m.id));

function updateMore() {

}
function watchMore() {
  const mo = $('#more');
  if (feedObs) { feedObs.disconnect(); feedObs = null; }
  if (!mo || mo.hidden || !('IntersectionObserver' in window)) return;
  if (feedShown >= feedOrder.length) return;
  feedObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) appendFeed(6, true); }, { root: $('#view'), rootMargin: '700px 0px' });
  feedObs.observe(mo);
}
function appendFeed(n, fresh) {
  const host = $('#plist');
  if (!host) return;
  let html = '', guard = 0, added = 0;
  while (added < n && guard++ < 60) {
    if (feedShown >= feedOrder.length) break;
    const pid = feedOrder[feedShown++], p = S.posts.find(x => x.id === pid);
    if (!p) continue;
    html += postCard(p, fresh);
    added++;
  }
  host.insertAdjacentHTML('beforeend', html);
  if (!feedOrder.length) host.innerHTML = feedMode === 'following' ? followEmpty() : feedEmpty();

}

function peopleFind(raw) {
  const toks = norm(raw).replace(/^@+/, '').split(/[\s._-]+/).filter(Boolean);
  const all = Object.values(S.users);
  if (!toks.length) return all.filter(u => u.id !== S.session).sort((a, b) => followersOf(b.id) - followersOf(a.id));
  const t0 = toks[0];
  return all.map(u => {
    const un = norm(u.username), uw = un.split(/[._-]+/), nm = norm(u.name), ls = norm(u.last);
    const hay = uw.join(' ') + ' ' + un + ' ' + nm + ' ' + ls + ' ' + norm(u.city) + ' ' + norm((u.tags || []).join(' '));
    if (!toks.every(t => hay.includes(t))) return null;
    let s = 0;
    if (un.startsWith(t0)) s += 60; else if (uw.some(w => w.startsWith(t0))) s += 45;
    if (nm.startsWith(t0)) s += 50;
    if (ls.startsWith(t0)) s += 35;
    if (u.id === S.session) s -= 100;
    return [u, s + followersOf(u.id) * .5];
  }).filter(Boolean).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
/* kind: 'spot' | 'dot' | null (los dos). Busca por nombre, calle, municipio, categoría y también por el Spot al que pertenece un Dot */
function spotsFind(q, kind) {
  let list = Object.values(S.spots).filter(sp => !kind || (kind === 'dot') === isDot(sp));
  const toks = q ? q.split(/\s+/).filter(Boolean) : [];
  if (toks.length) list = list.filter(sp => { const par = parentOf(sp), hay = norm([sp.name, par ? par.name : '', sp.city, sp.street || '', (sp.cats || []).join(' ')].join(' ')); return toks.every(t => hay.includes(t)); });
  return list.sort((a, b) => spotStats(b).avg - spotStats(a).avg || a.name.localeCompare(b.name));
}
function drawResults() {
  const res = $('#res');

  if (SO && SO.map) { drawMapSuggest(); return; }
  const raw = searchQ.trim(), q = norm(raw), mode = searchMode;
  const people = (list, lim) => `<div class="reslist">${list.slice(0, lim).map(userRow).join('')}</div>`;
  const places = (list, lim) => `<div class="reslist">${list.slice(0, lim).map(sp => resCard(sp)).join('')}</div>`;
  const more = (total, shown, m, what) => total > shown ? `<button type="button" class="smore" data-act="search-mode" data-m="${m}">Ver ${what} (${total})</button>` : '';
  const sec = (t, gap) => `<h2 class="sec${gap ? ' gap' : ''}">${t}</h2>`;
  let h = '';
  if (mode === 'personas') {
    const L = peopleFind(raw);
    h = (q ? '' : sec('Personas para seguir')) + (L.length ? people(L, 60) : `<p class="empty-s">No encontramos a nadie llamado “${esc(raw)}”. Prueba con su nombre o su @usuario.</p>`);
  } else if (mode === 'todo') {
    const P = peopleFind(raw), SP = spotsFind(q, 'spot'), DT = spotsFind(q, 'dot');
    if (!q) h = sec('Spots mejor calificados') + places(SP, 3) + more(SP.length, 3, 'spots', 'más Spots') + sec('Dots mejor calificados', 1) + places(DT, 3) + more(DT.length, 3, 'dots', 'más Dots') + sec('Personas para seguir', 1) + people(P, 3) + more(P.length, 3, 'personas', 'más personas');
    else if (!P.length && !SP.length && !DT.length) h = `<p class="empty-s">No encontramos nada con “${esc(raw)}”. Prueba con otro nombre, un @usuario, un Spot un Dot o una persona.</p>`;
    else {
      const parts = [];
      if (SP.length) parts.push(['Spots', places(SP, 4) + more(SP.length, 4, 'spots', 'todos los Spots')]);
      if (DT.length) parts.push(['Dots', places(DT, 4) + more(DT.length, 4, 'dots', 'todos los Dots')]);

/* Busca spots por nombre, calle, municipio, categoría o tipo de lugar, y también zonas del mapa (ríos, lagunas, municipios) */
function mapFind(raw) {
  const toks = norm(raw).split(/[\s,._-]+/).filter(Boolean);
  if (!toks.length) return [];
  const out = [], names = new Set();
  Object.values(S.spots).forEach(sp => {
    const kinds = (sp.kinds || []).map(k => KIND_ES[k] || '').join(' ');
    const par = parentOf(sp);
    const hay = norm([sp.name, par ? par.name : '', sp.street, sp.city, (sp.cats || []).join(' '), kinds, sp.desc].join(' '));
    if (!toks.every(t => hay.includes(t))) return;
    const nm = norm(sp.name);
    names.add(nm);
    const it = spotItem(sp);
    it.s = (nm.startsWith(toks[0]) ? 40 : nm.includes(toks[0]) ? 25 : 0) + spotStats(sp).avg;
    out.push(it);
  });
  MAP_LABELS.forEach((L, i) => {
    if (!['city', 'zone', 'place', 'water'].includes(L.k)) return;
    const nm = norm(L.t);
    if (names.has(nm) || !toks.every(t => nm.includes(t))) return;
    out.push({ id: 'lb:' + i, kind: 'place', x: L.x, y: L.y, label: L.t, sub: 'Zona del mapa', s: 20 });
  });
  return out.sort((a, b) => b.s - a.s);
}

function doSaveSpot() {

    const ntp = { id: 'n_' + uid(), type: 'prop-new', to: 'u_spotz', from: m.id, propId: prp.id, kind: f.kind, name: d.name, ts: t0, read: false };

    if (S.users.u_spotz) S.notifs.push(ntp);

      S.props.pop();
      S.notifs = S.notifs.filter(n => n.id !== ntp.id);
      return fail('No hay espacio en este dispositivo para guardar tantas fotos. Quita alguna e inténtalo de nuevo.');

  if (!sp) sp = { id: (dot ? 'dt_' : 'sp_') + uid(), kind: f.kind, ratings: {}, reviews: [], by: pr ? pr.uid : m.id, ts: now, ejemplo: false };
  const moved = sp.lat !== d.lat || sp.lng !== d.lng;

  const prev = { pr: pr ? JSON.stringify(pr) : null, post: post ? post.spotId : null };
  if (created) S.spots[sp.id] = sp;
  let nt = null;
  if (post && dot && (pr || !post.spotId)) post.spotId = sp.id;
  if (pr) {
    pr.status = 'accepted'; pr.spotId = sp.id; pr.name = sp.name; pr.decidedAt = now;
    nt = { id: 'n_' + uid(), type: 'prop-ok', to: pr.uid, from: m.id, propId: pr.id, spotId: sp.id, kind: f.kind, name: sp.name, ts: now, read: false };
    S.notifs.push(nt);
    S.notifs.forEach(n => { if (n.type === 'prop-new' && n.propId === pr.id) n.read = true; });
  }
  if (!commit()) {
    if (created) delete S.spots[sp.id]; else Object.assign(sp, old);
    if (post) post.spotId = prev.post;
    if (pr && prev.pr) Object.assign(pr, JSON.parse(prev.pr));
    if (nt) S.notifs = S.notifs.filter(n => n.id !== nt.id);

function deletePost(id) {
  const i = S.posts.findIndex(p => p.id === id);
  if (i < 0) return;
  const p = S.posts[i];
  S.posts.splice(i, 1);
  S.notifs = S.notifs.filter(n => n.postId !== id);
  S.props = (S.props || []).filter(x => x.postId !== id);
  commit();
  toast('Publicación eliminada');
  if (cur().name === 'post') back(); else refresh();
}
function deleteAccount() {
  const id = S.session;
  S.posts = S.posts.filter(p => p.uid !== id);
  S.posts.forEach(p => { p.likes = p.likes.filter(x => x !== id); p.reposts = p.reposts.filter(x => x !== id); });
  cmPurgeUser(id);
  Object.values(S.spots).forEach(sp => { delete sp.ratings[id]; sp.reviews = sp.reviews.filter(r => r.uid !== id); });
  S.notifs = S.notifs.filter(n => n.to !== id && n.from !== id);

function reactText(f, p) {
  const b = REACT_BANK[f.replace('u_', '')];
  if (!b) return 'Qué buena foto';
  const sp = p.spotId ? S.spots[p.spotId] : null;
  S.simN = S.simN || {};
  const n = S.simN[f] || 0;
  S.simN[f] = n + 1;
  if (sp && n % 2 === 1) return b.lug[((n - 1) / 2) % b.lug.length].replace('{lugar}', sp.name);
  return b.gen[(sp ? n / 2 : n) % b.gen.length | 0];
}
/* Cuenta nueva: la oficial y 5 perfiles la siguen en los primeros minutos */
function scheduleFollows(st, userId) {
  const u = st.users[userId];
  if (!u || u.fx) return;
  u.fx = true;
  const now = Date.now(), who = ['u_spotz'].concat(pickSome(SEED_UIDS, userId, 5));
  [18, 50, 95, 150, 225, 320].forEach((sec, i) => st.sim.push({ id: 'sm_' + uid(), type: 'follow', to: userId, from: who[i], dueAt: now + sec * 1000 }));
}
/* Publicación nueva: 5 o 6 perfiles le dan like y 2 o 3 comentan */
function scheduleReactions(st, p) {
  const now = Date.now(), order = pickSome(SEED_UIDS.filter(x => x !== p.uid), p.id, SEED_UIDS.length);
  const nl = 5 + (hashStr(p.id) % 2), nc = 2 + (hashStr(p.id + 'c') % 2);
  order.slice(0, nl).forEach((f, i) => st.sim.push({ id: 'sm_' + uid(), type: 'like', postId: p.id, from: f, dueAt: now + (12 + i * 22 + (hashStr(p.id + f) % 9)) * 1000 }));
  order.slice(0, nc).forEach((f, i) => st.sim.push({ id: 'sm_' + uid(), type: 'comment', postId: p.id, from: f, dueAt: now + (40 + i * 55 + (hashStr(f + p.id) % 20)) * 1000 }));
}
function syncPostCounts(p) {
  $$('[data-act="like"]').forEach(b => { if (b.dataset.id === p.id) { const sp = b.querySelector('span'); if (sp) sp.textContent = fmtCount(p.likes.length); } });
  cmSyncCounts(p);
  if (CS && CS.pid === p.id && $('#cs-list')) csPaint();
}
function tick() {
  if (!S) return;
  const now = Date.now();
  let ch = false, ping = null, pingRev = null;
  S.reminders.forEach(r => {
    if (!r.done && r.dueAt <= now) {
      r.done = true; ch = true;
      if (user(r.userId) && S.spots[r.spotId]) {
        S.notifs.push({ id: 'n_' + uid(), type: 'review', to: r.userId, spotId: r.spotId, ts: now, read: false });
        if (r.userId === S.session) pingRev = S.spots[r.spotId].name;
      }
    }
  });
  S.sim = (S.sim || []).filter(s => {
    if (s.dueAt > now) return true;
    const f = user(s.from);
    if (!f) return false;
    const ts = Math.min(now, s.dueAt);
    if (s.type === 'follow') {
      const t = user(s.to);
      if (t && t.id !== f.id && !(f.following || []).includes(t.id)) {
        f.following = (f.following || []).concat(t.id); ch = true;
        if (t.perms && t.perms.notif !== false) {
          S.notifs.push({ id: 'n_' + uid(), type: 'follow', to: t.id, from: f.id, ts, read: false });
          if (t.id === S.session) ping = f.username + ' empezó a seguirte';
        }
      }
      return false;
    }
    const p = S.posts.find(x => x.id === s.postId);
    if (!p) return false;
    const o = user(p.uid), tell = !!o && !!o.perms && o.perms.notif !== false;
    if (s.type === 'comment') {
      const c = { id: 'c_' + uid(), uid: f.id, text: reactText(f.id, p), ts, likes: [] };
      cmList(p).push(c); ch = true;
      if (tell) {
        S.notifs.push({ id: 'n_' + uid(), type: 'comment', to: p.uid, from: f.id, postId: p.id, spotId: p.spotId, cid: c.id, text: c.text.slice(0, 90), ts, read: false });
        if (p.uid === S.session) ping = f.username + ' comentó tu foto';
      }
      syncPostCounts(p);
      return false;
    }
    if (!p.likes.includes(f.id)) {
      p.likes.push(f.id); ch = true;
      if (tell) {
        S.notifs.push({ id: 'n_' + uid(), type: 'like', to: p.uid, from: f.id, postId: p.id, spotId: p.spotId, ts, read: false });
        if (p.uid === S.session) ping = f.username + ' le dio like a tu foto';
      }
      syncPostCounts(p);
    }
    return false;
  });
  if (ch) {
    commit();
    if (S.session && me()) {
      updateBadge();
      if (cur().name === 'notifs') refresh();
      if (pingRev) toast('¿Cómo te fue en ' + pingRev + '? Te dejamos una notificación.', 4200);
      else if (ping) toast(ping, 3200);
    }
  }
}

/* ============ Proporción de las fotos ============
   La tarjeta de la publicación toma la proporción de la foto, con un mínimo de 4:5 (vertical) y un máximo de 16:9 (horizontal).
   Si la foto se pasa de esos límites se recorta al centro. La vista previa del perfil puede llegar hasta 9:16 vertical. */
const ARC = new Map(); /* foto → ancho / alto */
const AR_POST = [4 / 5, 16 / 9];
const AR_TILE = [9 / 16, 16 / 9];
const arClamp = (v, r) => Math.min(r[1], Math.max(r[0], v || 1.25));
function arKnown(ref) {
  if (!ref) return 0;
  if (ARC.has(ref)) return ARC.get(ref);
  return ref.startsWith('scene:') ? 1.25 : 0;
}
const arOf = p => +p.ar || arKnown(p.imgs && p.imgs[0]) || 0;
const arCss = (p, r) => arClamp(arOf(p), r).toFixed(4);
function arMeasure(ref) {
  return new Promise(res => {
    const k = arKnown(ref);
    if (k) { res(k); return; }
    const src = imgSrc(ref);
    if (!src) { res(0); return; }
    const im = new Image();
    im.onload = () => { const v = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0; if (v) ARC.set(ref, v); res(v); };
    im.onerror = () => res(0);
    im.src = src;
  });
}
/* Las publicaciones guardadas antes de esta versión no traen su proporción: se mide una sola vez y se guarda */
async function arBackfill() {
  let n = 0;
  for (const p of S.posts) {
    if (p.ar || !p.imgs || !p.imgs[0]) continue;
    const v = await arMeasure(p.imgs[0]);
    if (v) { p.ar = +v.toFixed(3); n++; }
  }
  if (!n) return;
  commit();
  const cur1 = cur();
  if (cur1 && ['feed', 'account', 'profile', 'spot', 'post'].includes(cur1.name) && !SO) refresh();
}
/* Cuadrícula del perfil: columnas que respetan la proporción de cada foto (hasta 9:16) y conservan el orden */
function postGrid(list, label) {
  const cols = [[], [], []], hs = [0, 0, 0];
  list.forEach(p => {
    const r = arClamp(arOf(p), AR_TILE);
    let k = 0;
    for (let i = 1; i < 3; i++) if (hs[i] < hs[k] - 0.001) k = i;
    cols[k].push(`<button class="gt" style="aspect-ratio:${r.toFixed(4)}" data-act="open-post" data-id="${p.id}" aria-label="${esc(label ? label(p) : 'Ver publicación')}"><img src="${esc(imgSrc(p.imgs[0]))}" alt="" loading="lazy">${p.imgs.length > 1 ? `<span class="multi">${ic('image', 14)}</span>` : ''}</button>`);
    hs[k] += 1 / r;
  });
  return `<div class="mas">${cols.map(c => `<div class="mas-c">${c.join('')}</div>`).join('')}</div>`;
}
setTimeout(() => { try { arBackfill(); } catch (e) { /* sin datos */ } }, 120);

/* Número corto para que la fila de acciones no se desborde: 105 · 1.2k · 28.3k · 923k · 1.2M */
function fmtCount(n) {
  if (!n) return '';
  const f = (v, u) => (v < 100 ? String(Math.floor(v * 10) / 10).replace(/\.0$/, '') : String(Math.floor(v))) + u;
  if (n < 1000) return String(n);
  if (n < 1e6) return f(n / 1e3, 'k');
  return f(n / 1e6, 'M');
}

/* ============ Etiquetas: @usuario de las personas que sigues (publicaciones y comentarios) ============ */
const MN_ESC = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function mnFollowing(who) {
  const w = who || me();
  return w ? (w.following || []).map(id => user(id)).filter(u => u && u.id !== w.id) : [];
}
/* Ids de las personas que sigues y aparecen como @usuario en el texto (solo se puede etiquetar a quien sigues) */
function mnParse(text, who) {
  const fol = mnFollowing(who), out = [], re = /@([A-Za-z0-9._]+)/g;
  let r;
  while ((r = re.exec(text || ''))) {
    const a = norm(r[1]), b = norm(r[1].replace(/[._]+$/, ''));
    const u = fol.find(x => norm(x.username) === a) || fol.find(x => norm(x.username) === b);
    if (u && !out.includes(u.id)) out.push(u.id);
  }
  return out;
}
/* Texto seguro con las etiquetas convertidas en enlaces al perfil */
function mnHtml(text, tags) {
  const us = (tags || []).map(id => user(id)).filter(Boolean).sort((a, b) => b.username.length - a.username.length);
  if (!us.length) return esc(text);
  const by = {};
  us.forEach(u => { by[u.username.toLowerCase()] = u; });
  const re = new RegExp('@(' + us.map(u => MN_ESC(u.username)).join('|') + ')(?![A-Za-z0-9_])', 'gi');
  return esc(text).replace(re, (m, name) => {
    const u = by[name.toLowerCase()];
    return u ? `<button type="button" class="plain mn" data-act="open-profile" data-id="${u.id}">${m}</button>` : m;
  });
}
/* Avisos para quienes fueron etiquetados */
function mnNotifs(type, p, ids, c) {
  const m = me(), now = Date.now();
  return ids.filter(id => { const u = user(id); return u && id !== m.id && u.perms && u.perms.notif !== false; })
    .map(id => ({ id: 'n_' + uid(), type, to: id, from: m.id, postId: p.id, spotId: p.spotId, cid: c ? c.id : undefined, text: (c ? c.text : p.caption || '').slice(0, 90), ts: now, read: false }));
}

/* ---- Sugerencias al escribir @ ---- */

  } else if (t.id === 'pk-q') pkSearch(t.value);
  else if (t.id === 'ph-b' && PH) { PH.b = +t.value; phSchedule(); }
  else if (t.id === 'ph-c' && PH) { PH.c = +t.value; phSchedule(); }
});
/* El teclado se oculta con Enter (en formularios largos), al tocar fuera de un campo o al deslizar la pantalla */
const KB_FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=button]):not([type=submit]), textarea';
const kbActive = () => { const a = document.activeElement; return a && a.matches && a.matches(KB_FIELD) ? a : null; };
document.addEventListener('pointerdown', e => {
  const a = kbActive();
  if (!a || (a.closest && a.closest('.sheet, #sov'))) return;
  if (e.target.closest && e.target.closest(KB_FIELD + ', select, label, button, a, [data-act], [role="button"], .mn-pop')) return;
  a.blur();
});
let KB_Y = null;
document.addEventListener('touchstart', e => { KB_Y = e.touches.length === 1 ? e.touches[0].clientY : null; }, { passive: true });
document.addEventListener('touchmove', e => {
  const a = kbActive();
  if (!a || KB_Y == null || (a.closest && a.closest('.sheet, #sov'))) return;
  if (Math.abs(e.touches[0].clientY - KB_Y) > 28 && !(e.target.closest && e.target.closest('textarea'))) { a.blur(); KB_Y = null; }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const a = e.target;
  if (a && a.matches && a.matches('input') && a.closest && a.closest('#f-edit, #f-se')) { e.preventDefault(); a.blur(); }
});

/* ============ Arranque ============ */
persist = storageOK();
S = load() || seed();
if (S) normalizeState(S);
if (S.session && !S.users[S.session]) S.session = null;
render();
if (!persist) toast('Tu navegador no permite guardar datos: lo que hagas se perderá al cerrar.', 6000);
setInterval(tick, 6000);
tick();

</script>
